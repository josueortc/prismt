# MATLAB package and app, on the oldest supported release and the newest, with the Python
# engine installed so the cross-language and app tests run too.
name: matlab
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [R2021a, latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Python engine
        run: |
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.5 scipy==1.15.3 h5py==3.16.0 scikit-learn==1.7.2 optuna==5.0.0
          python -m pip install -e .
          echo "PRISMT_PYTHON=$(which python)" >> "$GITHUB_ENV"
      - uses: matlab-actions/setup-matlab@v2
        with: {release: "${{ matrix.release }}"}   # base MATLAB only: PRISMT needs no toolboxes
      - name: Virtual display (the app tests build hidden uifigures, which need X on Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('tests/matlab'); r = runPrismtTests(); assert(~any([r.Failed]), 'MATLAB tests failed')
