# Python engine: fast tests on every push, the slow end-to-end ones (HPO, fake SLURM) too.
name: python
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, deps: pinned}
          - {os: macos-14, deps: pinned}
          - {os: ubuntu-latest, deps: latest}   # early warning for new numpy / torch / optuna releases
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Install (pinned, as in environment.yml)
        if: matrix.deps == 'pinned'
        run: |
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.2.5 scipy==1.15.3 h5py==3.16.0 scikit-learn==1.7.2 optuna==5.0.0 pytest==9.1.1
          python -m pip install -e .
      - name: Install (latest)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy h5py scikit-learn optuna pytest
          python -m pip install -e .
      - run: python -m prismt doctor
      # Failures are also printed as annotations, so they are readable without opening the log.
      - name: Fast tests
        run: python -m pytest tests/python -q -m "not slow" -rf --tb=line -p no:cacheprovider 2>&1 | tee fast.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Slow tests
        run: python -m pytest tests/python -q -m slow -rf --tb=line -p no:cacheprovider 2>&1 | tee slow.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          for f in fast.txt slow.txt; do
            [ -f "$f" ] || continue
            grep -E "^(FAILED|ERROR) |Error|assert" "$f" | head -20 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          done
      - name: Settings reference is up to date
        run: python tools/make_settings_doc.py --check
